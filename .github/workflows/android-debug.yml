name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build standalone debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      PROJECT: Seeker/Seeker.csproj
      CONFIGURATION: Debug
      APPLICATION_ID: com.kingcurryman.songseeker
      MIN_SDK: '23'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload restore "$PROJECT"

      - name: Determine target framework
        run: |
          TFM=$(dotnet msbuild "$PROJECT" -getProperty:TargetFramework -v:q | tr -d '[:space:]')
          echo "TFM=$TFM" >> "$GITHUB_ENV"

      - name: Install Android SDK dependencies
        run: |
          dotnet build "$PROJECT" \
            --target InstallAndroidDependencies \
            --framework "$TFM" \
            -p:AcceptAndroidSDKLicenses=true

      - name: Restore packages
        run: dotnet restore "$PROJECT"

      - name: Build standalone debug APK
        run: |
          dotnet publish "$PROJECT" \
            --configuration "$CONFIGURATION" \
            --framework "$TFM" \
            --no-restore \
            -p:AndroidKeyStore=false \
            -p:AndroidPackageFormats=apk \
            -p:AndroidEnableFastDeployment=false \
            -p:EmbedAssembliesIntoApk=true \
            -p:ContinuousIntegrationBuild=true

      - name: Stage and verify APK
        run: |
          APK=$(find "Seeker/bin/$CONFIGURATION/$TFM" -type f -name '*-Signed.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo '::error::No signed, installable APK was produced'
            find "Seeker/bin/$CONFIGURATION/$TFM" -type f -name '*.apk' -print || true
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          APK_ANALYZER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer -print | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo '::error::Android apksigner was not found'
            exit 1
          fi
          if [ -z "$APK_ANALYZER" ]; then
            echo '::error::Android apkanalyzer was not found'
            exit 1
          fi

          mkdir -p artifacts
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee artifacts/apksigner-verification.txt

          ACTUAL_APPLICATION_ID=$("$APK_ANALYZER" manifest application-id "$APK" | tr -d '\r\n')
          ACTUAL_MIN_SDK=$("$APK_ANALYZER" manifest min-sdk "$APK" | tr -d '\r\n')
          if [ "$ACTUAL_APPLICATION_ID" != "$APPLICATION_ID" ]; then
            echo "::error::Expected application ID $APPLICATION_ID, found $ACTUAL_APPLICATION_ID"
            exit 1
          fi
          if [ "$ACTUAL_MIN_SDK" != "$MIN_SDK" ]; then
            echo "::error::Expected minimum SDK $MIN_SDK, found $ACTUAL_MIN_SDK"
            exit 1
          fi

          "$APK_ANALYZER" manifest print "$APK" > artifacts/AndroidManifest.xml
          cp "$APK" artifacts/song-seeker-debug.apk
          cp LICENSE artifacts/LICENSE
          ls -lh artifacts/song-seeker-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: song-seeker-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
